name: Security Validation

on:
  push:
    branches:
      - main
      - feat/deepresearch-prompt-injection
    paths:
      - 'lib/llm-security/**'
      - 'tests/llm-security/**'
      - '.security-policy.json'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/llm-security/**'
      - 'tests/llm-security/**'
      - '.security-policy.json'
      - 'package.json'

jobs:
  security-tests:
    name: Run Security Tests & Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Phase 2 ML Detector Tests
        run: node tests/llm-security/phase2-ml-detectors.js

      - name: Run Phase 3 Adversarial Tests
        run: node tests/llm-security/adversarial-quick-test.js

      - name: Run Phase 3 Integration Tests
        run: node tests/llm-security/integration-real-world.js

      - name: Validate security implementation (local only)
        run: |
          echo "Mythos-Jr validation requires Claude CLI authentication."
          echo "This is validated locally before committing."
          echo "Run locally: npm run validate:security"
        continue-on-error: true
